# ============================================================================
#  frpc 内网穿透配置模板
#
#  使用方法（二选一）：
#   A. 管理台方式（推荐）：复制本文件内容，粘贴到管理台「FRP 内网穿透」页保存，
#      按需修改后在该页点击「启动」。也可开启「网关启动时自动启动 FRP」。
#   B. 手动方式：复制为 frpc.ini，修改后执行 ./frpc -c frpc.ini
#
#  注意：
#   - local_port 必须是网关 API 端口（默认 9010）。管理台端口（默认 9009）
#     仅限内网访问，切勿穿透到公网！
#   - 下方 server_addr / user / token / remote_port 请全部替换为你自己的
#     FRP 服务商信息（如 ChmlFrp、SakuraFrp、自建 frps 等）。
# ============================================================================

[common]
server_addr = frp.example.com        # ← 换成你的 FRP 服务器地址
server_port = 7000                   # ← 换成你的 FRP 服务器端口
tls_enable = false                   # 服务商要求时改为 true
user = your_user_id                  # ← 换成你的用户标识（服务商分配）
token = your_token                   # ← 换成你的访问令牌（切勿提交到公开仓库！）

[ai-gateway]
type = tcp
local_ip = 127.0.0.1
local_port = 9010                    # 网关 API 端口（默认 9010）
remote_port = 60000                  # ← 换成你的远程端口；外网即 http://服务器地址:远程端口
